{% extends "base.html" %}
{% block content %}
  <section class="archive-gallery" aria-label="Photographs">
    {% if photo_entries %}
      {% for entry, row, column in gallery_items %}
        <a class="archive-card archive-card--{{ entry.orientation }}" href="{{ entry_url(entry.id) }}" aria-label="{{ entry.title }}" style="--gallery-row: {{ row }}; --gallery-column: {{ column }}">
          <figure>
            <img src="{{ media_url(entry.id, entry.cover) }}" alt="{{ entry.get('image_alt', entry.title) }}" loading="lazy">
          </figure>
        </a>
      {% endfor %}
    {% else %}
      <p>No photographs yet.</p>
    {% endif %}
  </section>
{% endblock %}
