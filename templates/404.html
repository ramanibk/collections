{% extends "base.html" %}

{% block content %}
  <header class="introduction">
    <p class="eyebrow">404</p>
    <h1>Page not found</h1>
    <p class="subtitle">This page may have moved, or it may not be part of the archive.</p>
  </header>

  <section aria-labelledby="return-heading">
    <h2 id="return-heading">Return to the collection</h2>
    <p><a href="{{ home_url() }}">Go to the homepage</a> or browse <a href="{{ posts_url() }}">all posts</a>.</p>
  </section>
{% endblock %}
