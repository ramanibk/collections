{% extends "base.html" %}
{% block content %}
  <section class="notes-list" aria-label="Notes archive">
    {% if posts %}
      <div class="note-row note-row--heading" aria-hidden="true">
        <span>Date</span><span>Title</span><span>Tags</span>
      </div>
      {% for entry in posts %}
        <article class="note-row" data-title="{{ entry.title | lower }}" data-date="{{ entry.date.isoformat() }}">
          <time datetime="{{ entry.date.isoformat() }}">{{ entry.date.isoformat() }}</time>
          <h2><a href="{{ entry_url(entry.id) }}">{{ entry.title }}</a></h2>
          <p class="note-tags">
            <span>{{ entry.type | upper }}</span>
            {% for tag in entry.tags %}<span>{{ tag | upper }}</span>{% endfor %}
          </p>
        </article>
      {% endfor %}
    {% else %}
      <p class="empty-state">No notes yet.</p>
    {% endif %}
  </section>
{% endblock %}
